<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wind Speed Calc">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Wind Speed Calc</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0b7a8f">
<style>
:root{
  --bg:#eaf2f5;--surface:#fff;--ink:#0d2230;--muted:#5b7280;--line:#d0dde3;
  --accent:#0b7a8f;--accent-ink:#fff;--key:#fff;--key-press:#d9e6eb;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#08171f;--surface:#0f2735;--ink:#e6f1f5;--muted:#8aa5b3;--line:#1c3a4b;
    --accent:#3cc3d9;--accent-ink:#04202a;--key:#13303f;--key-press:#1d4256;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08171f;--surface:#0f2735;--ink:#e6f1f5;--muted:#8aa5b3;--line:#1c3a4b;
  --accent:#3cc3d9;--accent-ink:#04202a;--key:#13303f;--key-press:#1d4256;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"SF Pro Rounded","SF Pro Text",system-ui,"Helvetica Neue",Arial,sans-serif;
  overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.app{height:100%;display:flex;flex-direction:column;gap:10px;padding:12px 16px 12px;max-width:520px;margin:0 auto}
h1{margin:0;font-size:15px;font-weight:600;color:var(--muted);text-align:center;letter-spacing:.2px}
.units{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--surface);padding:5px;border-radius:16px;border:1px solid var(--line)}
.units button{
  border:0;border-radius:12px;padding:13px 0;font-size:16px;font-weight:600;line-height:1;font-family:inherit;
  background:transparent;color:var(--ink);transition:background .15s,color .15s;
}
.units button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.display{
  display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 16px;
}
.display .num{font-size:52px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.display .u{font-size:17px;font-weight:600;color:var(--accent);white-space:nowrap}
.clear{border:0;background:var(--key);color:var(--muted);border-radius:50%;width:34px;height:34px;font-size:18px;align-self:center;flex:none}
.results{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:baseline;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 16px}
.row .l{font-size:15px;font-weight:600;color:var(--muted)}
.row .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.row .v small{font-size:14px;font-weight:600;color:var(--muted);margin-left:5px}
.force{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:11px 16px 13px}
.force .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.force .name{font-size:17px;font-weight:700}
.force .rng{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.scale{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;margin-top:10px}
.scale i{height:10px;border-radius:5px;opacity:.28;transition:opacity .15s,transform .15s}
.scale i.on{opacity:1;transform:scaleY(1.7)}
[hidden]{display:none!important}
.loc{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 8px 6px 6px}
.locbtn{border:0;border-radius:12px;width:44px;height:44px;font-size:22px;background:var(--accent);flex:none}
.locinfo{flex:1;min-width:0}
#locMain{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
#locSub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow{font-size:26px;font-weight:700;color:var(--accent);display:inline-block;transition:transform .3s;flex:none}
.use{border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;font-weight:700;font-family:inherit;background:var(--key);color:var(--ink);flex:none}
.use:active{background:var(--key-press)}
.pad{flex:1;min-height:215px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:8px}
.pad button{
  border:0;border-radius:16px;background:var(--key);color:var(--ink);
  font-size:33px;font-weight:600;line-height:1;font-family:inherit;font-variant-numeric:tabular-nums;border:1px solid var(--line);
}
.pad button:active,.clear:active{background:var(--key-press)}
.units button:active{transform:scale(.97)}
</style>
</head>
<body>
<div class="app">
  <h1>Wind Speed Calc <span style="opacity:.55">v1</span></h1>
  <div class="units" id="units" role="group" aria-label="Unit"></div>
  <div class="display">
    <span class="num" id="num">15</span>
    <span class="u" id="uLabel">knots</span>
    <button class="clear" id="clr" aria-label="Clear">×</button>
  </div>
  <div class="loc">
    <button class="locbtn" id="locBtn" aria-label="Get wind at my location">📍</button>
    <div class="locinfo"><div id="locMain">Wind at my location</div><div id="locSub">Tap 📍 to fetch</div></div>
    <span class="arrow" id="locArrow" hidden>↓</span>
    <button class="use" id="locUse" hidden>Use</button>
  </div>
  <div class="results" id="results"></div>
  <div class="force">
    <div class="t"><span class="name" id="fName"></span><span class="rng" id="fRng"></span></div>
    <div class="scale" id="scale"></div>
  </div>
  <div class="pad" id="pad"></div>
</div>
<script>
(function(){
  var UNITS=[
    {id:"bft",btn:"Beaufort",label:"Beaufort",short:"Bft"},
    {id:"kmh",btn:"km/h",label:"km/h",short:"km/h"},
    {id:"ms",btn:"m/s",label:"m/s",short:"m/s"},
    {id:"kn",btn:"Knots",label:"knots",short:"kn"}
  ];
  var NAMES=["Calm","Light air","Light breeze","Gentle breeze","Moderate breeze","Fresh breeze","Strong breeze","Near gale","Gale","Strong gale","Storm","Violent storm","Hurricane force"];
  var RANGES=["under 1","1–3","4–6","7–10","11–16","17–21","22–27","28–33","34–40","41–47","48–55","56–63","64+"];
  var LIMITS=[1,4,7,11,17,22,28,34,41,48,56,64];
  var KN=0.514444;
  var cur="kn", str="15";

  function toMs(v,u){
    if(u==="bft") return 0.836*Math.pow(v,1.5);
    if(u==="kmh") return v/3.6;
    if(u==="kn") return v*KN;
    return v;
  }
  function fromMs(ms,u){
    if(u==="bft") return Math.pow(ms/0.836,2/3);
    if(u==="kmh") return ms*3.6;
    if(u==="kn") return ms/KN;
    return ms;
  }
  function forceOf(kn){var i=0;while(i<12&&kn>=LIMITS[i])i++;return i;}
  function fmt(n){return (Math.round(n*10)/10).toFixed(1);}
  function $(id){return document.getElementById(id);}

  var unitsEl=$("units"), scaleEl=$("scale");
  UNITS.forEach(function(u){
    var b=document.createElement("button");
    b.textContent=u.btn;b.dataset.u=u.id;
    b.addEventListener("click",function(){cur=u.id;clamp();render();});
    unitsEl.appendChild(b);
  });
  for(var i=0;i<=12;i++){
    var s=document.createElement("i");
    s.style.background="hsl("+Math.round(190-i*15.8)+",70%,48%)";
    scaleEl.appendChild(s);
  }
  var keys=["1","2","3","4","5","6","7","8","9",".","0","⌫"];
  keys.forEach(function(k){
    var b=document.createElement("button");
    b.textContent=k;
    if(k==="⌫") b.setAttribute("aria-label","Delete");
    b.addEventListener("click",function(){press(k);});
    $("pad").appendChild(b);
  });
  $("clr").addEventListener("click",function(){str="";render();});

  function clamp(){
    if(cur==="bft"&&(parseFloat(str)||0)>12) str="12";
  }
  function press(k){
    if(k==="⌫"){str=str.slice(0,-1);}
    else if(k==="."){
      if(str.indexOf(".")>-1) return;
      str=(str===""?"0":str)+".";
    }else{
      if(str==="0") str="";
      if(str.replace(".","").length>=6) return;
      var next=str+k;
      if(cur==="bft"&&parseFloat(next)>12) return;
      str=next;
    }
    render();
  }

  function render(){
    var v=parseFloat(str)||0;
    var ms=toMs(v,cur);
    var kn=ms/KN;
    var f=cur==="bft"?Math.min(12,Math.max(0,Math.round(v))):forceOf(kn);

    $("num").textContent=str===""?"0":str;
    $("uLabel").textContent=UNITS.filter(function(u){return u.id===cur;})[0].label;
    Array.prototype.forEach.call(unitsEl.children,function(b){
      b.setAttribute("aria-pressed",b.dataset.u===cur?"true":"false");
    });

    var html="";
    UNITS.forEach(function(u){
      if(u.id===cur) return;
      var val,approx="";
      if(u.id==="bft"){val="≈ "+forceOf(kn);}
      else{val=(cur==="bft"?"≈ ":"")+fmt(fromMs(ms,u.id));}
      html+='<div class="row"><span class="l">'+u.label+'</span><span class="v">'+val+(u.id==="bft"?"":"<small>"+u.short+"</small>")+'</span></div>';
    });
    $("results").innerHTML=html;

    $("fName").textContent="Force "+f+" · "+NAMES[f];
    $("fRng").textContent=RANGES[f]+" kn";
    Array.prototype.forEach.call(scaleEl.children,function(s,i){s.className=i===f?"on":"";});
  }

  var KEY="windcalc.last", last=null;
  var DIRS=["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
  function msg(a,b){$("locMain").textContent=a;$("locSub").textContent=b||"";}
  function showWind(w,fresh){
    var t=new Date(w.t),p=function(n){return("0"+n).slice(-2);};
    var day=t.toDateString()===new Date().toDateString()?"":" "+t.getDate()+"/"+(t.getMonth()+1);
    msg(Math.round(w.kn)+" kn · gusts "+Math.round(w.gust)+" · from "+DIRS[Math.round(w.dir/22.5)%16]+" "+Math.round(w.dir)+"°",
        (fresh?"Updated ":"Saved reading from ")+p(t.getHours())+":"+p(t.getMinutes())+day+(fresh?"":" (old)"));
    $("locArrow").hidden=false;$("locArrow").style.transform="rotate("+w.dir+"deg)";
    $("locUse").hidden=false;last=w;
  }
  function loadSaved(fresh){
    try{var w=JSON.parse(localStorage.getItem(KEY));if(w&&typeof w.kn==="number"){showWind(w,fresh);return true;}}catch(e){}
    return false;
  }
  $("locBtn").addEventListener("click",function(){
    if(!navigator.geolocation){msg("Location not available");return;}
    msg("Locating…","Please wait");
    navigator.geolocation.getCurrentPosition(function(p){
      var url="https://api.open-meteo.com/v1/forecast?latitude="+p.coords.latitude.toFixed(3)+"&longitude="+p.coords.longitude.toFixed(3)+"&current=wind_speed_10m,wind_gusts_10m,wind_direction_10m&wind_speed_unit=kn";
      fetch(url).then(function(r){return r.json();}).then(function(j){
        var c=j.current,w={kn:c.wind_speed_10m,gust:c.wind_gusts_10m,dir:c.wind_direction_10m,t:Date.now()};
        try{localStorage.setItem(KEY,JSON.stringify(w));}catch(e){}
        showWind(w,true);
      }).catch(function(){
        if(!loadSaved(false)) msg("No signal","Could not load the wind");
      });
    },function(e){
      msg(e&&e.code===1?"Location permission denied":"Could not get location",e&&e.code===1?"Allow it in iOS Settings → Privacy → Location":"Try again");
    },{timeout:15000,maximumAge:600000});
  });
  $("locUse").addEventListener("click",function(){
    if(!last) return;
    cur="kn";str=String(Math.round(last.kn*10)/10);render();
  });
  loadSaved(false);
  if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){});}
  render();
})();
</script>
</body>
</html>
